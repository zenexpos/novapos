<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPOS Zen — Mode Hors-ligne</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #F8FAFC;
            color: #0F172A;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container { padding: 2rem; }
        .logo { width: 80px; height: 80px; margin-bottom: 1.5rem; }
        h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 0.5rem; }
        p { color: #64748B; max-width: 300px; line-height: 1.5; }
        .btn {
            margin-top: 2rem;
            padding: 0.75rem 1.5rem;
            background-color: #AFB42B;
            color: white;
            border: none;
            border-radius: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="/icon.svg" alt="Logo" class="logo">
        <h1>Zone de Paix (Offline)</h1>
        <p>Il semble que vous soyez déconnecté. iPOS Zen continue de fonctionner localement، mais cette page n'est pas encore en cache.</p>
        <button onclick="window.location.reload()" class="btn">Réessayer</button>
    </div>
</body>
</html>
