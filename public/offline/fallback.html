<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPOS Zen — Mode Hors-Ligne</title>
    <style>
        body {
            background-color: #F8FAFC;
            color: #0F172A;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 400px;
            padding: 2rem;
        }
        .icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            color: #AFB42B;
        }
        h1 {
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.05em;
            margin: 0 0 1rem 0;
        }
        p {
            color: #64748B;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        button {
            background-color: #0F172A;
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: transform 0.2s;
        }
        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🛰️</div>
        <h1>Zone Hors-Ligne</h1>
        <p>Cette page n'a pas encore été mise en cache. Connectez-vous à Internet une fois pour activer l'accès complet à ce module.</p>
        <button onclick="window.location.reload()">Réessayer</button>
    </div>
</body>
</html>
