<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPOS Zen - Hors-ligne</title>
    <style>
        :root { --primary: #AFB42B; --bg: #F8FAFC; --text: #0F172A; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; }
        .card { padding: 40px; background: white; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); max-width: 400px; width: 90%; }
        .icon { font-size: 48px; margin-bottom: 20px; }
        h1 { font-weight: 900; letter-spacing: -1px; margin: 0 0 10px; }
        p { color: #64748B; line-height: 1.6; margin-bottom: 30px; }
        button { background: var(--primary); color: white; border: none; padding: 12px 30px; border-radius: 12px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📶🚫</div>
        <h1>Zone Hors-Ligne</h1>
        <p>iPOS Zen est conçu pour fonctionner sans internet, mais cette page spécifique n'est pas encore en cache.</p>
        <button onclick="window.location.reload()">Réessayer</button>
    </div>
</body>
</html>
