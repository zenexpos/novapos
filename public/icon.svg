<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="elite-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c07814" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- شاشة الحاسوب -->
  <rect x="24" y="24" width="80" height="56" rx="8" fill="#1f2937" stroke="url(#elite-grad)" stroke-width="4" />
  <path d="M52 80L48 92H80L76 80" stroke="url(#elite-grad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M40 92H88" stroke="url(#elite-grad)" stroke-width="4" stroke-linecap="round" />
  
  <!-- الدفتر المحاسبي المتداخل -->
  <g filter="url(#glow)">
    <rect x="64" y="48" width="44" height="60" rx="4" fill="white" stroke="#c07814" stroke-width="2" />
    <path d="M72 60H100" stroke="#c07814" stroke-width="2" stroke-linecap="round" />
    <path d="M72 72H100" stroke="#c07814" stroke-width="2" stroke-linecap="round" />
    <path d="M72 84H100" stroke="#c07814" stroke-width="2" stroke-linecap="round" />
    <!-- حلقات الدفتر -->
    <circle cx="64" cy="58" r="2.5" fill="#c07814" />
    <circle cx="64" cy="74" r="2.5" fill="#c07814" />
    <circle cx="64" cy="90" r="2.5" fill="#c07814" />
  </g>
</svg>