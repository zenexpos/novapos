<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- ZEN RING -->
  <circle cx="256" cy="256" r="230" stroke="url(#gold_grad)" stroke-width="8" stroke-dasharray="10 20" opacity="0.2" />
  
  <!-- MONITOR BASE FRAME -->
  <rect x="80" y="100" width="352" height="240" rx="32" fill="#0D0804" stroke="url(#gold_grad)" stroke-width="10" />
  <rect x="226" y="340" width="60" height="60" fill="url(#gold_grad)" opacity="0.8" />
  <rect x="156" y="400" width="200" height="15" rx="7.5" fill="url(#gold_grad)" />
  
  <!-- THE LEDGER SCREEN -->
  <rect x="105" y="125" width="302" height="190" rx="16" fill="#1A120B" />
  
  <!-- LEDGER BINDING (RINGS) -->
  <rect x="115" y="140" width="6" height="160" rx="3" fill="url(#gold_grad)" opacity="0.3" />
  <circle cx="118" cy="160" r="4" fill="url(#gold_grad)" />
  <circle cx="118" cy="190" r="4" fill="url(#gold_grad)" />
  <circle cx="118" cy="220" r="4" fill="url(#gold_grad)" />
  <circle cx="118" cy="250" r="4" fill="url(#gold_grad)" />
  <circle cx="118" cy="280" r="4" fill="url(#gold_grad)" />
  
  <!-- LEDGER CONTENT LINES -->
  <path d="M160 160 H360" stroke="url(#gold_grad)" stroke-width="6" stroke-linecap="round" opacity="0.6" />
  <path d="M160 195 H360" stroke="url(#gold_grad)" stroke-width="6" stroke-linecap="round" opacity="0.6" />
  <path d="M160 230 H360" stroke="url(#gold_grad)" stroke-width="6" stroke-linecap="round" opacity="0.6" />
  <path d="M160 265 H280" stroke="url(#gold_grad)" stroke-width="6" stroke-linecap="round" opacity="0.6" />
  
  <!-- PROFIT CHECKMARK (ELITE SYMBOL) -->
  <path d="M330 240 L360 270 L420 200" stroke="#f59e0b" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
</svg>