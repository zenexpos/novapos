<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Solid Background Circle -->
  <circle cx="256" cy="256" r="240" fill="#1E293B"/>
  
  <!-- Screen Base (Digital Symbol) -->
  <rect x="100" y="140" width="312" height="200" rx="12" fill="#FFFFFF"/>
  <rect x="110" y="150" width="292" height="150" rx="4" fill="#F8FAFC"/>
  
  <!-- Stand for the screen -->
  <rect x="226" y="340" width="60" height="30" fill="#FFFFFF"/>
  <rect x="186" y="370" width="140" height="10" rx="5" fill="#FFFFFF"/>

  <!-- Ledger Book (Accounting Symbol) -->
  <rect x="240" y="180" width="140" height="180" rx="8" fill="#AFB42B" stroke="#1E293B" stroke-width="4"/>
  
  <!-- Ledger Details (Lines) -->
  <line x1="260" y1="210" x2="360" y2="210" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <line x1="260" y1="240" x2="360" y2="240" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <line x1="260" y1="270" x2="360" y2="270" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <line x1="260" y1="300" x2="360" y2="300" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Accent Point (Gold Coin/Success) -->
  <circle cx="380" cy="340" r="30" fill="#D4AF37" stroke="#1E293B" stroke-width="4"/>
  <path d="M372 340L378 348L388 332" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>