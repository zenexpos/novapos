
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPOS - Mode Hors Ligne</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: #020617;
            color: #f8fafc;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            flex-direction: column;
        }
        .container { padding: 2rem; max-width: 400px; }
        h1 { color: #6366f1; font-size: 1.8rem; margin-bottom: 1rem; }
        p { font-size: 1rem; line-height: 1.6; color: #94a3b8; margin-bottom: 2rem; }
        .btn {
            background-color: #6366f1;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .icon { width: 64px; height: 64px; margin-bottom: 1.5rem; color: #6366f1; }
    </style>
</head>
<body>
    <div class="container">
        <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0 1 19 12.55M5 12.55a10.94 10.94 0 0 1 5.17-2.39M10.71 5.05A16 16 0 0 1 22.58 9M1.42 9a15.91 15.91 0 0 1 4.7-2.88M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01" />
        </svg>
        <h1>Mode Hors Ligne</h1>
        <p>iPOS est conçu pour fonctionner sans internet.   
Si l'application ne charge pas, essayez de rafraîchir la page.</p>
        <button class="btn" onclick="window.location.reload( )">Réessayer</button>
    </div>
</body>
</html>
